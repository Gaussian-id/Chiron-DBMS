name: Chiron Horizon verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-compatibility:
    name: database-compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:database-availability

  go-agents:
    name: Go agent release packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Test agents and build every release target with fresh dependencies
        run: agents/scripts/build_go_release_agents.sh release-agents
      - uses: actions/upload-artifact@v4
        with:
          name: verified-go-agents
          path: release-agents/
          if-no-files-found: error

  offline-packaging:
    name: Offline driver package integrity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zstd zip
      - name: Check raw offline registries and compressed download packages
        working-directory: agents/scripts
        run: python3 -m unittest discover -p '*_test.py'

  managed-jre:
    name: Managed Java runtime ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install zstd
        shell: bash
        run: |
          if command -v zstd >/dev/null; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y zstd ;;
            macOS) brew install zstd ;;
            Windows) choco install zstd -y ;;
          esac
      - name: Build and smoke the managed Java runtime
        shell: bash
        run: agents/scripts/build_managed_jre.sh release-jre ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-jre-${{ matrix.platform }}
          path: release-jre/
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: "16777216"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev libfontconfig1-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/core-architecture.test.mjs scripts/dependency-checksums.test.mjs
      - run: node scripts/audit-branding.mjs
      - run: node scripts/sync-connection-types.mjs --check
      - run: pnpm exec vue-tsc --noEmit -p apps/desktop/tsconfig.json
      - run: pnpm exec vitest run apps/desktop/src/lib/chiron apps/desktop/src/components/vector/__tests__ apps/desktop/src/lib/compat apps/desktop/src/i18n/__tests__/chironMessages.spec.ts apps/desktop/src/components/editor/__tests__/AiAssistant.chironLifecycle.spec.ts
      - run: pnpm test:database-availability
      - run: cargo test -p chiron-horizon-core --no-default-features --features sqlite-bundled --lib legacy::tests
      - name: Test backup lifecycle
        run: "cargo test -p chiron-horizon-core --no-default-features --features sqlite-bundled --lib scheduled_backup::"
      - name: Test the complete Rust core before release tagging
        if: runner.os == 'Linux'
        run: cargo test -p chiron-horizon-core --no-default-features --features sqlite-bundled --lib
      - run: cargo test -p chiron-horizon-core --no-default-features --features sqlite-bundled --test ai_credentials --test chirondb_connector
      - run: cargo test -p chiron-horizon-driver-agent --lib
      - run: cargo test -p chiron-horizon-driver-postgres --lib postgres_reset_search_path_sql_selects_dialect_compatible_statement
      - run: cargo check -p chiron-horizon-cli -p chiron-horizon-web --no-default-features
      - run: cargo test --manifest-path plugins/sdk/cli/Cargo.toml creates_frontend_rust_and_go_projects
      - run: node --test packages/plugin-cli/tests/launcher.test.mjs packages/plugin-cli/tests/dev-launcher.test.mjs
      - name: Build standalone desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm exec tauri build --features custom-protocol --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Verify macOS local signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "target/${{ matrix.target }}/release/bundle/macos/Chiron Horizon.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Chiron Horizon-0.1.6-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
