services:
  gauss-horizon:
    image: Gaussian-id/Gauss-Horizon
    ports:
      - "4224:4224"
    environment:
      # Change this before exposing Gauss Horizon to a network.
      - GAUSS_HORIZON_PASSWORD=changeme
      # Uncomment when serving Gauss Horizon behind a reverse-proxy subpath.
      # - GAUSS_HORIZON_PUBLIC_BASE_PATH=/gauss-horizon
    volumes:
      - gauss-horizon-data:/app/data
    restart: unless-stopped

volumes:
  gauss-horizon-data:
