services:
  chiron-horizon:
    image: Gaussian-id/Gauss-Horizon
    ports:
      - "4224:4224"
    environment:
      # Change this before exposing Chiron Horizon to a network.
      - CHIRON_HORIZON_PASSWORD=changeme
      # Uncomment when serving Chiron Horizon behind a reverse-proxy subpath.
      # - CHIRON_HORIZON_PUBLIC_BASE_PATH=/chiron-horizon
    volumes:
      - chiron-horizon-data:/app/data
    restart: unless-stopped

volumes:
  chiron-horizon-data:
