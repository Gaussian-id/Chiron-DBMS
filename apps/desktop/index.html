<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/connection-dialog-legacy.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chiron Horizon</title>
    <style>
      html,
      body,
      #root {
        background-color: rgb(255 255 255);
      }

      html.dark,
      html.dark body,
      html.dark #root {
        background-color: rgb(19 20 22);
      }
      html.theme-chiron, html.theme-chiron body, html.theme-chiron #root { background-color: #fafbff; }
      html.theme-chiron.dark, html.theme-chiron.dark body, html.theme-chiron.dark #root { background-color: #070b16; }
    </style>
    <script data-chiron-horizon-startup-theme>
      (() => {
        const root = document.documentElement;
        let mode = null;
        let cornerStyle = null;
        let palette = null;

        // localStorage can throw when WebView storage is unavailable; keep the existing light fallback.
        try {
          mode = localStorage.getItem("chiron-horizon-theme");
          cornerStyle = localStorage.getItem("chiron-horizon-corner-style");
          palette = localStorage.getItem("chiron-horizon-theme-palette");
        } catch {}

        const followsSystem = mode === "system" || mode === "soft-system";
        let dark = mode === "dark" || mode === "soft-dark";

        if (followsSystem) {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            dark = false;
          }
        }

        root.classList.toggle("dark", dark);
        root.classList.toggle("theme-chiron", palette === "chiron" || (!palette && !String(mode).startsWith("soft-")));
        root.dataset.cornerStyle = cornerStyle === "none" || cornerStyle === "small" ? cornerStyle : "large";
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <script data-chiron-horizon-startup-input-guard>
      (() => {
        const readyEvent = "chiron-horizon:startup-ready";
        const preventStartupEscape = (event) => {
          if (event.key !== "Escape") return;
          event.preventDefault();
          event.stopImmediatePropagation();
        };

        window.addEventListener("keydown", preventStartupEscape, true);
        window.addEventListener(
          readyEvent,
          () => {
            window.removeEventListener("keydown", preventStartupEscape, true);
          },
          { once: true },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #root:empty {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: system-ui, sans-serif;
          color: #888;
          font-size: 13px;
        }
        #root:empty::after {
          content: "Loading…";
        }
      </style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
