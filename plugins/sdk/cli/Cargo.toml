[package]
name = "chiron-horizon-plugin-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Scaffold and package Chiron Horizon plugins"

[workspace]

[[bin]]
name = "chiron-horizon-plugin"
path = "src/main.rs"

[dependencies]
chiron-horizon-plugin-packager = { version = "0.1.0", path = "../packager" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
