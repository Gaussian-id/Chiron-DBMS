name: Release Chiron Horizon plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: Gaussian-id/Gauss-Horizon/.github/workflows/plugin-release-reusable.yml@plugin-sdk-v1
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: chiron-horizon-plugin package .
      package-path: dist/*.chiron-horizonp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.3
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
